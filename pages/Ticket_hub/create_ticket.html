<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Ticket</title>
  <!-- Google Fonts: Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="index.html">Ticketing Portal</a>
    <div class="ms-auto">
      <a href="index.html" class="btn btn-outline-light btn-sm">&larr; Back to Dashboard</a>
    </div>
  </nav>

  <div class="container my-5" style="max-width: 650px;">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Create New Ticket</h4>
      </div>
      <div class="card-body p-4">
        <form id="createForm">
          <div class="mb-3">
            <label for="title" class="form-label font-weight-bold">Title *</label>
            <input type="text" class="form-control" id="title" required placeholder="Enter ticket title" />
          </div>

          <div class="mb-3">
            <label for="desc" class="form-label">Description</label>
            <textarea class="form-control" id="desc" rows="3" placeholder="Enter detailed issue summary"></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="category" class="form-label">Category *</label>
              <select class="form-select" id="category" required>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="UI/UX">UI/UX</option>
                <option value="DevOps">DevOps</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="priority" class="form-label">Priority *</label>
              <select class="form-select" id="priority" required>
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="assignee" class="form-label">Assignee *</label>
              <input type="text" class="form-control" id="assignee" required placeholder="e.g. Muskan" />
            </div>
            <div class="col-md-6">
              <label for="due" class="form-label">Due Date</label>
              <input type="date" class="form-control" id="due" />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="index.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastMessage">Done</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
