 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticket Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border: none;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    .table-hover tbody tr:hover {
      background-color: #f1f3f5;
    }
    .badge-priority-high { background-color: #dc3545; }
    .badge-priority-medium { background-color: #fd7e14; }
    .badge-priority-low { background-color: #0d6efd; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-ticket-perforated me-2"></i>TaskDesk</a>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="mb-0 fw-bold">Ticket Management</h3>
        <p class="text-muted small mb-0">Create, track, and manage workspace tickets</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ticketModal" onclick="resetForm()">
        <i class="bi bi-plus-lg me-1"></i> Create Ticket
      </button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card p-3 bg-white border-start border-primary border-4">
          <div class="text-muted small">Total Tickets</div>
          <div class="fs-4 fw-bold" id="totalCount">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 bg-white border-start border-warning border-4">
          <div class="text-muted small">In Progress</div>
          <div class="fs-4 fw-bold" id="progressCount">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 bg-white border-start border-success border-4">
          <div class="text-muted small">Completed</div>
          <div class="fs-4 fw-bold" id="completedCount">0</div>
        </div>
      </div>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Assignee</th>
              <th>Priority</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="ticketTableBody">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalTitle">Create New Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="ticketForm">
          <div class="modal-body">
            <input type="hidden" id="ticketId" />
            
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" required placeholder="Short summary of the issue" />
            </div>

            <div class="mb-3">
              <label for="assignee" class="form-label">Assignee</label>
              <input type="text" class="form-control" id="assignee" required placeholder="Name of person assigned" />
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label for="priority" class="form-label">Priority</label>
                <select class="form-select" id="priority">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status">
                  <option value="Open">Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="3" placeholder="Detailed description..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let tickets = JSON.parse(localStorage.getItem('tickets')) || [
      { id: 'TCK-101', title: 'Fix login authentication issue', assignee: 'Alex Vance', priority: 'High', status: 'In Progress', description: 'Users getting 500 error on submit.' },
      { id: 'TCK-102', title: 'Update homepage banner assets', assignee: 'Sarah Jenkins', priority: 'Low', status: 'Completed', description: 'Replace Q2 graphics with Q3 launch imagery.' }
    ];

    const ticketForm = document.getElementById('ticketForm');
    const ticketModal = new bootstrap.Modal(document.getElementById('ticketModal'));

    function saveTickets() {
      localStorage.setItem('tickets', JSON.stringify(tickets));
      renderTickets();
    }

    function renderTickets() {
      const tbody = document.getElementById('ticketTableBody');
      tbody.innerHTML = '';

      let progressCount = 0;
      let completedCount = 0;

      if (tickets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No tickets found. Click "Create Ticket" to add one.</td></tr>`;
      } else {
        tickets.forEach((ticket) => {
          if (ticket.status === 'In Progress') progressCount++;
          if (ticket.status === 'Completed') completedCount++;

          const priorityBadge = 
            ticket.priority === 'High' ? 'badge-priority-high' :
            ticket.priority === 'Medium' ? 'badge-priority-medium' : 'badge-priority-low';

          const statusBadge = 
            ticket.status === 'Completed' ? 'bg-success' :
            ticket.status === 'In Progress' ? 'bg-warning text-dark' : 'bg-secondary';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="fw-bold text-muted">${ticket.id}</td>
            <td>
              <div class="fw-bold">${ticket.title}</div>
              <small class="text-muted d-block text-truncate" style="max-width: 250px;">${ticket.description || 'No details'}</small>
            </td>
            <td>${ticket.assignee}</td>
            <td><span class="badge ${priorityBadge}">${ticket.priority}</span></td>
            <td><span class="badge ${statusBadge}">${ticket.status}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-1" onclick="editTicket('${ticket.id}')">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteTicket('${ticket.id}')">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('totalCount').innerText = tickets.length;
      document.getElementById('progressCount').innerText = progressCount;
      document.getElementById('completedCount').innerText = completedCount;
    }

    function resetForm() {
      document.getElementById('ticketId').value = '';
      document.getElementById('ticketForm').reset();
      document.getElementById('modalTitle').innerText = 'Create New Ticket';
    }

    function editTicket(id) {
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      document.getElementById('ticketId').value = ticket.id;
      document.getElementById('title').value = ticket.title;
      document.getElementById('assignee').value = ticket.assignee;
      document.getElementById('priority').value = ticket.priority;
      document.getElementById('status').value = ticket.status;
      document.getElementById('description').value = ticket.description;

      document.getElementById('modalTitle').innerText = 'Edit Ticket';
      ticketModal.show();
    }

    function deleteTicket(id) {
      if (confirm('Are you sure you want to delete this ticket?')) {
        tickets = tickets.filter(t => t.id !== id);
        saveTickets();
      }
    }

    ticketForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('ticketId').value;
      const title = document.getElementById('title').value;
      const assignee = document.getElementById('assignee').value;
      const priority = document.getElementById('priority').value;
      const status = document.getElementById('status').value;
      const description = document.getElementById('description').value;

      if (id) {
        const ticket = tickets.find(t => t.id === id);
        ticket.title = title;
        ticket.assignee = assignee;
        ticket.priority = priority;
        ticket.status = status;
        ticket.description = description;
      } else {
        const newId = 'TCK-' + Math.floor(100 + Math.random() * 900);
        tickets.push({ id: newId, title, assignee, priority, status, description });
      }

      saveTickets();
      ticketModal.hide();
    });

    renderTickets();
  </script>
</body>
</html>
